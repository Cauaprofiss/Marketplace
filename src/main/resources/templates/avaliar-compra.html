<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="/Assets/JavaScript/feedback.js?v=20261013-3" th:src="@{/Assets/JavaScript/feedback.js(v='20261013-3')}" defer></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Avaliar compra - Campus MarketPlace</title>
  <link rel="stylesheet" th:href="@{/Assets/css/home.css(v='20261103-profile-identity-size-2')}" href="/Assets/css/home.css?v=20261103-profile-identity-size-2">
  <link rel="stylesheet" th:href="@{/Assets/css/avaliacoes.css(v='20261013-full-image')}" href="/Assets/css/avaliacoes.css?v=20261013-full-image">
  <link rel="stylesheet" href="/Assets/css/feedback.css?v=20261013-3" th:href="@{/Assets/css/feedback.css(v='20261013-3')}">
  <link rel="stylesheet" href="/Assets/css/product-photo-background.css?v=20261014-1" th:href="@{/Assets/css/product-photo-background.css(v='20261014-1')}">
  <script src="/Assets/JavaScript/product-photo-background.js?v=20261014-1" th:src="@{/Assets/JavaScript/product-photo-background.js(v='20261014-1')}" defer></script>
</head>
<body class="rating-page">
  <th:block th:replace="~{fragments/campus-header :: campusHeader}"></th:block>
  <main class="rating-main">
    <header class="rating-heading"><small>Campus Marketplace</small><h1>Avaliar compra</h1><p>Sua experiência ajuda a fortalecer a comunidade.</p></header>
    <div th:if="${erro != null}" th:text="${erro}" class="campus-notice campus-notice--error" data-campus-notice hidden role="alert"></div>
    <form class="rating-panel product-rating-panel" th:action="@{/compras/{id}/avaliar(id=${idCompraVendedor})}" method="post">
      <input type="hidden" name="idItemCompra" th:value="${item.idItemCompra}">
      <section class="rating-product-summary">
        <div class="rating-product-image"><img th:if="${item.produto != null and item.produto.fotoUrl != null}" th:src="@{${item.produto.fotoUrl}}" alt="Produto avaliado"><span th:unless="${item.produto != null and item.produto.fotoUrl != null}">Produto</span></div>
        <small th:text="${'Pedido #CM-' + #numbers.formatInteger(idCompraVendedor,4)}">Pedido #CM-2048</small>
        <h2 th:text="${item.produto.nome}">Bolo de chocolate</h2>
        <p th:text="${item.produto.usuario != null ? 'Vendido por ' + item.produto.usuario.nome : 'Vendedor'}">Vendido por Ana Souza</p>
      </section>
      <section class="rating-form-area">
        <h2>Como foi sua compra?</h2><p>Avalie a qualidade do produto recebido.</p>
        <fieldset class="star-rating" aria-label="Nota do produto">
          <input id="product-star-5" type="radio" name="nota" value="5" required><label for="product-star-5" title="5 estrelas">★</label>
          <input id="product-star-4" type="radio" name="nota" value="4"><label for="product-star-4" title="4 estrelas">★</label>
          <input id="product-star-3" type="radio" name="nota" value="3"><label for="product-star-3" title="3 estrelas">★</label>
          <input id="product-star-2" type="radio" name="nota" value="2"><label for="product-star-2" title="2 estrelas">★</label>
          <input id="product-star-1" type="radio" name="nota" value="1"><label for="product-star-1" title="1 estrela">★</label>
        </fieldset>
        <label class="rating-comment">Conte como foi a experiência…<textarea name="comentario" maxlength="1000" placeholder="Produto bem embalado, entrega no horário e atendimento muito atencioso."></textarea></label>
        <div class="rating-actions"><a th:href="@{/compras}">Cancelar</a><button type="submit">Enviar avaliação</button></div>
      </section>
    </form>
  </main>
  <footer class="rating-footer"><span>Campus Marketplace • IFSP São Miguel Paulista</span><span>© 2026</span></footer>
  <script th:src="@{/Assets/JavaScript/campus-header.js(v='20261025-search-click-1')}" src="/Assets/JavaScript/campus-header.js?v=20261025-search-click-1"></script>
</body></html>
