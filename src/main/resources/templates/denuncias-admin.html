<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head>
  <script src="/Assets/JavaScript/feedback.js?v=20261013-3" th:src="@{/Assets/JavaScript/feedback.js(v='20261013-3')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias — Campus MarketPlace</title><style>
@import url('/Assets/css/Global.css');:root{--green:#205944;--deep:#17392f;--soft:#dceae2;--cream:#f3f0df;--paper:#fffdf8;--red:#a92e26;--muted:#66736c;--line:#d7dccf}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--deep);font-family:var(--FontePoppinsRegular),Poppins,Arial,sans-serif}a{text-decoration:none;color:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:194px;padding:30px 12px 24px;background:var(--deep);color:#fff;display:flex;flex-direction:column}.brand{padding:0 12px 28px;font-family:var(--FontePoppinsBold);font-size:19px;line-height:1}.brand small{display:block;font-size:11px}.side-title{padding:0 12px;margin:8px 0 12px;color:#b8c9c1;font-size:9px;font-family:var(--FontePoppinsBold);text-transform:uppercase}.side a{display:block;margin:3px 0;padding:9px 16px;border-radius:8px;color:#dce8e2;font-size:11px}.side a.active,.side a:hover{background:#20634f;color:#fff;font-family:var(--FontePoppinsBold)}.main{min-width:0;flex:1}.top{height:54px;padding:0 35px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between}.top h2{margin:0;font-size:17px}.top a{padding:8px 45px;border-radius:8px;background:#fff;color:var(--green);font-family:var(--FontePoppinsBold);font-size:10px}.content{max-width:1120px;margin:auto;padding:30px 35px 55px}.heading h1{margin:0 0 4px;font-family:var(--FontePoppinsBold);font-size:28px}.heading p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;justify-content:flex-end;margin:20px 0 14px}.toolbar select{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;font:11px var(--FontePoppinsRegular)}.notice{margin:14px 0;padding:11px 14px;border-radius:10px;background:var(--soft);color:var(--green);font-size:11px}.notice.error{background:#f2ddda;color:var(--red)}.reports{display:grid;gap:14px}.report{padding:20px;border:1px solid #e5e4d8;border-radius:16px;background:var(--paper);box-shadow:0 7px 18px rgba(23,57,47,.07);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(180px,.7fr) auto;gap:22px;align-items:center}.report small{color:var(--muted);font-size:9px}.report h3{margin:5px 0;font-family:var(--FontePoppinsBold);font-size:16px}.report p{margin:0;color:#5f6862;font-size:11px}.report-info{display:grid;gap:4px;font-size:10px}.status{width:max-content;padding:5px 10px;border-radius:999px;background:#f6e6c8;color:#875b16;font-family:var(--FontePoppinsBold);font-size:9px}.status.resolvida{background:var(--soft);color:var(--green)}.status.arquivada{background:#e8e7df;color:#666}.actions{display:flex;gap:8px}.actions form{margin:0}.btn{min-width:105px;padding:9px 13px;border:0;border-radius:9px;background:var(--green);color:#fff;font:10px var(--FontePoppinsBold);cursor:pointer}.btn.reject{background:#ece9dd;color:var(--deep)}.empty{padding:55px;border-radius:16px;background:var(--paper);color:var(--muted);text-align:center;font-size:12px}@media(max-width:800px){.report{grid-template-columns:1fr}.sidebar{width:160px}.actions{flex-wrap:wrap}}@media(max-width:600px){.layout{display:block}.sidebar{width:100%;padding:15px}.side{display:flex;overflow:auto}.content{padding:24px 18px}.top{padding:0 20px}}
</style>  <link rel="stylesheet" href="/Assets/css/feedback.css?v=20261013-3" th:href="@{/Assets/css/feedback.css(v='20261013-3')}">
</head><body><div class="layout"><aside class="sidebar"><div class="brand"><small>Campus</small>MarketPlace</div><div class="side-title">Administração</div><nav class="side"><a th:href="@{/admin/dashboard}">Visão geral</a><a th:href="@{/admin/anuncios}">Anúncios</a><a class="active" th:href="@{/admin/denuncias}">Denúncias</a></nav></aside><section class="main"><header class="top"><h2>Denúncias</h2><a th:href="@{/logout}">Sair</a></header><main class="content"><div class="heading"><h1>Moderação de denúncias</h1><p>Aprovar uma denúncia retira imediatamente o anúncio da vitrine.</p></div><div th:if="${sucesso}" th:text="${sucesso}" class="campus-notice" data-campus-notice hidden role="status"></div><div th:if="${erro}" th:text="${erro}" class="campus-notice campus-notice--error" data-campus-notice hidden role="alert"></div><form class="toolbar" method="get" th:action="@{/admin/denuncias}"><select name="status" onchange="this.form.submit()"><option value="" th:selected="${statusSelecionado == null or statusSelecionado.isEmpty()}">Todas</option><option value="pendente" th:selected="${statusSelecionado == 'pendente'}">Pendentes</option><option value="resolvida" th:selected="${statusSelecionado == 'resolvida'}">Aprovadas</option><option value="arquivada" th:selected="${statusSelecionado == 'arquivada'}">Reprovadas</option></select></form><section class="reports"><article class="report" th:each="denuncia : ${denuncias}"><div><small th:text="${'#D-' + #numbers.formatInteger(denuncia.idDenuncia,3)}">#D-001</small><h3 th:text="${denuncia.produto != null ? denuncia.produto.nome : 'Anúncio removido'}">Produto</h3><p><b th:text="${denuncia.motivo}">Motivo</b><span th:if="${denuncia.descricao != null and !#strings.isEmpty(denuncia.descricao)}" th:text="${' — ' + denuncia.descricao}"></span></p></div><div class="report-info"><span th:text="${'Denunciante: ' + denuncia.denunciante.nome}">Denunciante</span><span th:if="${denuncia.usuarioDenunciado != null}" th:text="${'Vendedor: ' + denuncia.usuarioDenunciado.nome}">Vendedor</span><span class="status" th:classappend="${denuncia.status.name()}" th:text="${denuncia.status.name() == 'pendente' ? 'Pendente' : (denuncia.status.name() == 'resolvida' ? 'Aprovada' : 'Reprovada')}">Pendente</span></div><div class="actions" th:if="${denuncia.status.name() == 'pendente'}"><form th:action="@{/admin/denuncias/{id}/revisar(id=${denuncia.idDenuncia})}" method="post"><input type="hidden" name="aprovada" value="true"><button class="btn" type="submit">Aprovar denúncia</button></form><form th:action="@{/admin/denuncias/{id}/revisar(id=${denuncia.idDenuncia})}" method="post"><input type="hidden" name="aprovada" value="false"><button class="btn reject" type="submit">Reprovar</button></form></div></article><div class="empty" th:if="${denuncias == null or #lists.isEmpty(denuncias)}">Nenhuma denúncia encontrada.</div></section></main></section></div></body></html>
