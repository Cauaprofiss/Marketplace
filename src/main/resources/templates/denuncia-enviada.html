<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denúncia enviada - Campus MarketPlace</title>
  <link rel="stylesheet" th:href="@{/Assets/css/home.css(v='20261103-profile-identity-size-2')}" href="/Assets/css/home.css?v=20261103-profile-identity-size-2">
  <link rel="stylesheet" th:href="@{/Assets/css/denuncia-enviada.css}" href="/Assets/css/denuncia-enviada.css">
  <link rel="stylesheet" href="/Assets/css/product-photo-background.css?v=20261014-1" th:href="@{/Assets/css/product-photo-background.css(v='20261014-1')}">
  <script src="/Assets/JavaScript/product-photo-background.js?v=20261014-1" th:src="@{/Assets/JavaScript/product-photo-background.js(v='20261014-1')}" defer></script>
</head>
<body class="report-success-body">
<div class="report-success-shell">
  <main class="report-success-page">
    <section class="report-success-card" aria-labelledby="report-success-title">
      <img class="report-success-illustration"
           th:src="@{/Assets/Icones/denuncia-confirmada.svg}"
           src="/Assets/Icones/denuncia-confirmada.svg"
           alt="">

      <h1 id="report-success-title">Denúncia enviada</h1>

      <p class="report-success-description">
        Nossa equipe vai analisar o conteúdo informado.<br>
        Você não precisa realizar nenhuma outra ação agora.
      </p>

      <dl class="report-success-protocol">
        <div>
          <dt>Protocolo</dt>
          <dd th:text="${protocolo != null ? protocolo : '#D-084'}">#D-084</dd>
        </div>
        <div>
          <dt>Anúncio</dt>
          <dd th:text="${anuncio != null ? anuncio.nome : 'Bolo de chocolate'}">Bolo de chocolate</dd>
        </div>
      </dl>

      <a class="report-success-back" th:href="@{/produtos}" href="/produtos">Voltar à vitrine</a>
    </section>
  </main>

</div>
</body>
</html>
