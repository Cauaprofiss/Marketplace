<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    padding:30px;
}

.cadastro-card{
    width:450px;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-group input,
.input-group select,
.input-group textarea{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{
    outline:none;
    border-color:#4f46e5;
}

textarea{
    resize:none;
    height:80px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#3730a3;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="cadastro-card">

    <h1>Criar Conta</h1>
    <p>Preencha os dados abaixo</p>

    <form action="/cadastro" method="post">

        <div class="input-group">
            <label>Nome</label>
            <input
                type="text"
                name="nome"
                required>
        </div>

        <div class="input-group">
            <label>Sobrenome</label>
            <input
                type="text"
                name="sobrenome"
                required>
        </div>

        <div class="input-group">
            <label>E-mail</label>
            <input
                type="email"
                name="email"
                required>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input
                type="password"
                name="senha"
                required>
        </div>

        <div class="input-group">
            <label>Telefone</label>
            <input
                type="text"
                name="telefone">
        </div>

		<div class="input-group">
		    <label>Turma</label>
		    <select name="turma.idTurma" required>
		        <option value="">Selecione...</option>
		        <option th:each="t : ${turmas}"
		                th:value="${t.idTurma}"
		                th:text="${t.nomeTurma}">
		        </option>
		    </select>
		</div>

        <div class="input-group">
            <label>Descrição</label>
            <textarea name="descricao"></textarea>
        </div>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <div class="login-link">
        <a href="/login">Já possui uma conta? Entrar</a>
    </div>

</div>

</body>
</html>
