<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Campus Marketplace</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="header__bar">
        <a href="/index.html" class="brand">
            Campus Marketplace <span class="brand__tag">MURAL</span>
        </a>
        <nav class="header__nav">
            <a href="/cadastro.html">Criar conta</a>
        </nav>
    </div>
</header>

<div class="tela-form">
    <div class="painel-form">
        <div class="painel-form__eyebrow">Acesso de aluno</div>
        <h1>Entrar</h1>

        <div class="mensagem-erro" id="erro-form"></div>

        <form id="form-login" onsubmit="tratarLogin(event)">
            <div class="campo">
                <label for="email">E-mail acadêmico</label>
                <input type="email" id="email" required placeholder="voce@campus.edu.br">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primario">Entrar</button>
        </form>

        <div class="form-rodape">
            Esqueceu a senha? <a href="/recuperar-senha.html">Recuperar acesso</a><br><br>
            Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
