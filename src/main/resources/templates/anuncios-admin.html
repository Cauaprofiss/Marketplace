<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="/Assets/JavaScript/feedback.js?v=20261013-3" th:src="@{/Assets/JavaScript/feedback.js(v='20261013-3')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anúncios — Campus MarketPlace</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--green:#205944;--deep:#17392f;--soft:#dceae2;--cream:#f3f0df;--paper:#fffdf6;--red:#a92e26;--ink:#1a1a1a;--muted:#66736c;--line:#d7dccf;--white:#fff;--shadow:0 10px 24px rgba(23,57,47,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,Arial,sans-serif;background:var(--cream);color:var(--ink)}a{text-decoration:none;color:inherit}
.layout{display:flex;min-height:100vh}.sidebar{width:194px;background:var(--deep);color:#fff;padding:30px 12px 24px;display:flex;flex-direction:column;flex-shrink:0}.brand{padding:0 12px 28px;font-size:19px;line-height:1.02;font-weight:800}.brand small{display:block;font-size:11px;font-weight:500}.side-title{font-size:9px;color:#b8c9c1;text-transform:uppercase;font-weight:700;padding:0 12px;margin:8px 0 12px}.side a{display:block;padding:9px 16px;border-radius:8px;font-size:11px;color:#dce8e2;margin:3px 0}.side a:hover,.side a.active{background:#20634f;color:#fff;font-weight:700}.side-bottom{margin-top:auto;padding:14px 12px 0;font-size:9px;color:#8fa69d}.side-bottom b{display:block;color:#dce8e2;font-size:10px;margin-bottom:4px}
.main{flex:1;min-width:0}.top{height:54px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.top h2{font-size:17px;margin:0}.admin{background:#fff;color:var(--green);border:0;border-radius:8px;padding:8px 46px;font:700 10px Poppins;cursor:pointer}
.content{max-width:1010px;margin:0 auto;padding:24px 35px 45px}.heading h1{font-size:25px;color:var(--deep);margin:0 0 3px}.heading p{font-size:11px;color:var(--muted);margin:0}
.panel{background:var(--paper);border:1px solid #e8e8dc;border-radius:15px;padding:20px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:9px;padding:9px 18px;background:var(--green);color:#fff;font:700 10px Poppins;cursor:pointer;text-align:center}.btn:hover{filter:brightness(.95)}.btn.red{background:var(--red)}.btn.light{background:var(--soft);color:var(--green)}.btn.small{padding:7px 12px;font-size:9px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;font:11px Poppins}.select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;font:11px Poppins}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:9px}.table th{font-size:8px;text-transform:uppercase;color:var(--muted)}.status{display:inline-block;border-radius:20px;padding:5px 9px;background:var(--soft);color:var(--green);font-weight:700;font-size:8px}.status.red{background:#f2ddda;color:var(--red)}.status.gray{background:#e9e8df;color:#626b66}.status.orange{background:#f6e6c8;color:#8a5a10}
.modal{display:none;position:fixed;inset:0;background:rgba(23,57,47,.45);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-card{background:var(--paper);border-radius:15px;padding:22px;max-width:470px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18)}.modal-card h3{margin-top:0;color:var(--deep)}.field{margin:11px 0}.field label{display:block;font-size:9px;font-weight:700;margin-bottom:5px}.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:10px Poppins;background:#fff}
.modal-photos{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modal-photos img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.notice{padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--green);font-size:10px;margin-bottom:14px}.notice.danger{background:#f4dedb;color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:800px){.sidebar{width:160px}.content{padding:22px}.top{padding:0 22px}.admin{padding:8px 25px}}
@media(max-width:620px){.layout{display:block}.sidebar{width:100%;padding:15px}.side{display:flex;gap:4px;overflow:auto}.side-title,.side-bottom{display:none}.brand{padding:0 8px 12px}.main{width:100%}.top{height:50px}}
</style>  <link rel="stylesheet" href="/Assets/css/feedback.css?v=20261013-3" th:href="@{/Assets/css/feedback.css(v='20261013-3')}">
</head>
<body><div class="layout">

<aside class="sidebar">
    <div class="brand"><small>Campus</small>MarketPlace</div>
    <div class="side-title">Administração</div>
    <nav class="side">
        <a th:href="@{/admin/dashboard}">Visão geral</a>
        <a th:href="@{/admin/anuncios}" class="active">Anúncios</a>
        <a th:href="@{/admin/denuncias}">Denúncias</a>
    </nav>
    <div class="side-bottom"><b>Campus Marketplace</b>equipe responsável</div>
</aside>

<section class="main">
    <header class="top">
        <h2>Anúncios</h2>
        <a th:href="@{/logout}"><button class="admin" type="button">Sair</button></a>
    </header>

    <main class="content">

        <div class="heading">
            <h1>Gestão de anúncios</h1>
            <p>Consulte os produtos publicados no marketplace.</p>
        </div>

        <div th:if="${sucesso}" th:text="${sucesso}" class="campus-notice" data-campus-notice hidden role="status"></div>
        <div th:if="${erro}" th:text="${erro}" class="campus-notice campus-notice--error" data-campus-notice hidden role="alert"></div>

        <form method="get" th:action="@{/admin/anuncios}" class="toolbar">
            <input class="search" name="busca" placeholder="Buscar código ou produto..." th:value="${buscaAtual}">
            <select class="select" name="status" onchange="this.form.submit()">
                <option value="" th:selected="${statusSelecionado == null or statusSelecionado.isEmpty()}">Todos</option>
                <option value="disponivel" th:selected="${statusSelecionado == 'disponivel'}">Disponíveis</option>
                <option value="indisponivel" th:selected="${statusSelecionado == 'indisponivel'}">Indisponíveis</option>
                <option value="rascunho" th:selected="${statusSelecionado == 'rascunho'}">Rascunhos</option>
            </select>
            <button class="btn light" type="submit">Filtrar</button>
        </form>

        <div class="panel">
            <div class="table-wrap">
                <table class="table" id="ads">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Vendedor</th>
                            <th>Status</th>
                            <th>Denúncias</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr th:each="produto : ${produtos}">
                            <td th:text="${produto.codigoProduto}">#A-000</td>
                            <td th:text="${produto.nome}">Produto</td>
                            <td th:text="${produto.usuario != null ? produto.usuario.nome + ' ' + (produto.usuario.sobrenome ?: '') : '-'}">Vendedor</td>
                            <td>
								<span class="status"
								      th:classappend="${produto.status.name() == 'indisponivel' ? 'gray' : (produto.status.name() == 'em_revisao' ? 'orange' : (produto.status.name() == 'rascunho' ? 'gray' : (produto.status.name() == 'reprovado' ? 'red' : '')))}"
								      th:text="${produto.status}">status</span>
                            </td>
                            <td th:text="${produto.quantidadeDenuncias != null ? produto.quantidadeDenuncias : 0}">0</td>
                            <td>
                                <a th:if="${produto.status.name() == 'disponivel' or produto.status.name() == 'indisponivel'}" class="btn small" th:href="@{/produtos/{id}(id=${produto.idProduto})}">Ver anúncio</a>
                                <span th:unless="${produto.status.name() == 'disponivel' or produto.status.name() == 'indisponivel'}" style="color:var(--muted);font-size:9px">—</span>
                            </td>
                        </tr>

                        <tr th:if="${produtos == null or produtos.isEmpty()}">
                            <td colspan="6" class="empty">Nenhum anúncio encontrado.</td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </main>
</section>
</div>

</body>
</html>
