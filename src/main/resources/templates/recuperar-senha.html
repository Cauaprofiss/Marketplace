<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="/Assets/JavaScript/feedback.js?v=20261013-3" th:src="@{/Assets/JavaScript/feedback.js(v='20261013-3')}" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — Campus MarketPlace</title>
  <link rel="stylesheet" th:href="@{/Assets/css/recuperacao-senha.css(v='20260923-1')}" href="/Assets/css/recuperacao-senha.css?v=20260923-1">
  <link rel="stylesheet" href="/Assets/css/feedback.css?v=20261013-3" th:href="@{/Assets/css/feedback.css(v='20261013-3')}">
</head>
<body class="recovery-page">
  <main class="recovery-layout">
    <section class="recovery-form-panel" aria-labelledby="recovery-title">
      <div class="recovery-content">
        <a class="recovery-brand" th:href="@{/login}" href="/login" aria-label="Campus MarketPlace — voltar ao login">
          <span>Campus</span><strong>MarketPlace</strong>
        </a>
        <header class="recovery-heading">
          <h1 id="recovery-title">Recuperar senha</h1>
          <p>O link é seguro e expira em 30 minutos.</p>
        </header>
        <form class="recovery-form" th:action="@{/recuperar-senha}" method="post">
          <label class="recovery-field">
            <span>Email da conta:</span>
            <span class="recovery-input-wrap">
              <input type="email" name="email" th:value="${email}" placeholder="lucas@ifsp.edu.br" autocomplete="email" required autofocus>
              <b aria-hidden="true">@</b>
            </span>
          </label>
          <div class="campus-notice campus-notice--error" data-campus-notice hidden role="alert" th:if="${erro != null}" th:text="${erro}"></div>
          <p class="recovery-guidance"><span th:if="${erro == null}">Enviaremos as instruções apenas<br>para o Email.</span></p>
          <button class="recovery-submit" type="submit">Enviar link</button>
          <a class="recovery-back" th:href="@{/login}" href="/login">Voltar ao login</a>
        </form>
      </div>
    </section>
    <aside class="recovery-message-panel" aria-label="Orientação para recuperação de senha">
      <div>
        <h2>Acontece.<br>Vamos resolver.</h2>
        <p>Informe seu e-mail e siga o link recebido.</p>
      </div>
    </aside>
  </main>
</body>
</html>
