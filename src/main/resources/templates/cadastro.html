<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Campus Marketplace</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="header">
    <div class="header__bar">
        <a href="/index.html" class="brand">
            Campus Marketplace <span class="brand__tag">MURAL</span>
        </a>
        <nav class="header__nav">
            <a href="/login.html">Já tenho conta</a>
        </nav>
    </div>
</header>

<div class="tela-form">
    <div class="painel-form">
        <div class="painel-form__eyebrow">Novo cadastro</div>
        <h1>Criar conta</h1>

        <div class="mensagem-erro" id="erro-form"></div>

        <form id="form-cadastro" action="/cadastro" method="post">
            <div class="campo-linha">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="João">
                </div>
                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" required placeholder="Silva">
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="voce@campus.edu.br">
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="11999999999">
            </div>

            <div class="campo">
                <label for="turma">Turma</label>
				<select id="turma" name="turma.idTurma" required>

				    <option value="">Selecione sua turma</option>

				    <option th:each="t : ${turmas}"
				            th:value="${t.idTurma}"
				            th:text="${t.nomeTurma}">
				    </option>

				</select>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo de 6 caracteres">
            </div>

            <button type="submit" class="btn-primario">Criar conta</button>
        </form>

        <div class="form-rodape">
            Já tem conta? <a href="/login.html">Entrar</a>
        </div>
    </div>
</div>

<script>carregarTurmasNoSelect();</script>
</body>
</html>
